[workspace]
resolver = "2"
members = [
  "crates/ebd-cli",
  "crates/ebd-config",
  "crates/ebd-contract",
  "crates/ebd-core",
  "crates/ebd-mock-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
